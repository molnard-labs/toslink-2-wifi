# Optical Audio Bridge: open setup AP for first-time Wi-Fi provisioning.
# Based on the working JBL prototype; validate hardware and playback per device.
# GPIO4 -> optical transmitter data; GPIO48 -> onboard WS2812B RGB LED.
# The AP is open and the captive portal can update firmware when active.
# Use unique API/OTA credentials per unit; never commit populated secrets.
# No station SSID or password is compiled into this configuration.

esphome:
  name: optical-audio-bridge
  friendly_name: Optical Audio Bridge
  name_add_mac_suffix: true
  min_version: 2026.9.1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO

api:
  encryption:
    key: !secret optical_api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret optical_ota_password

wifi:
  power_save_mode: none
  ap:
    ap_timeout: 90s

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: RGB
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

i2s_audio:
  - id: digital_audio_bus

speaker:
  - platform: i2s_audio
    id: optical_output
    i2s_audio_id: digital_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO4
    spdif_mode: true
    use_apll: true
    i2s_mode: primary
    i2s_comm_fmt: stand_i2s
    mclk_multiple: 256
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 500ms
    timeout: 2s
  - platform: mixer
    id: audio_mixer
    output_speaker: optical_output
    task_stack_in_psram: true
    source_speakers:
      - id: music_mixer_input
      - id: announcement_mixer_input
  - platform: resampler
    id: music_input
    output_speaker: music_mixer_input
    bits_per_sample: 16
    task_stack_in_psram: true
  - platform: resampler
    id: announcement_input
    output_speaker: announcement_mixer_input
    bits_per_sample: 16
    task_stack_in_psram: true

media_player:
  - platform: speaker
    id: optical_player
    name: WiFi
    volume_initial: 25%
    buffer_size: 1000000
    task_stack_in_psram: true
    media_pipeline:
      speaker: music_input
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_input
      format: FLAC
      sample_rate: 48000
      num_channels: 2

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
